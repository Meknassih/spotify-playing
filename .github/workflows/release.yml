name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake autoconf automake libtool pkg-config

      - name: Build and install json-c 0.19
        run: |
          git clone --branch json-c-0.19 --depth 1 https://github.com/json-c/json-c.git
          cmake -S json-c -B json-c-build -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build json-c-build
          sudo cmake --install json-c-build
          sudo ldconfig

      - name: Build and install qlibc 2.5.1
        run: |
          git clone --branch v2.5.1 --depth 1 https://github.com/wolkykim/qlibc.git
          cd qlibc
          ./configure --prefix=/usr/local
          make
          sudo make install
          sudo ldconfig

      - name: Build
        run: make all

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: spotify-playing
          generate_release_notes: true
